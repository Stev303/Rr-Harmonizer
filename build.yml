name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RrHarmonizer_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rr-Harmonizer-VST3-Windows
          path: build/RrHarmonizer_artefacts/Release/VST3/*.vst3/**
          if-no-files-found: error
